name: Production Quality Check

# Runs data quality checks against production every morning at 6 AM ET (11 AM UTC),
# after all post-game pipelines have had time to complete.
#
# Also available on-demand via workflow_dispatch for manual investigation.
#
# Required GitHub secrets (court-vision / production environment):
#   PRODUCTION_PIPELINE_TOKEN — value of PIPELINE_API_TOKEN on production service
#
# Required GitHub variables (court-vision / production environment):
#   PRODUCTION_URL — public Railway URL for the production data-platform

on:
  schedule:
    - cron: '0 11 * * *'  # 6 AM ET daily
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    environment: court-vision / production

    steps:
      - name: Run quality checks on production
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          PRODUCTION_TOKEN: ${{ secrets.PRODUCTION_PIPELINE_TOKEN }}
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $PRODUCTION_TOKEN" \
            "$PRODUCTION_URL/v1/internal/quality/run?triggered_by=schedule")
          body=$(echo "$response" | head -n -1)
          http_status=$(echo "$response" | tail -n 1)

          if [ "$http_status" != "200" ]; then
            echo "Quality check trigger failed: HTTP $http_status"
            echo "$body"
            exit 1
          fi

          echo "Quality checks completed:"
          echo "$body" | python3 -m json.tool || echo "$body"

          failed=$(echo "$body" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('data', {}).get('failed_checks', 0))
          " 2>/dev/null || echo "0")

          critical_failed=$(echo "$body" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          checks = data.get('data', {}).get('checks', [])
          print(sum(1 for c in checks if c.get('status') == 'failed' and c.get('severity') == 'critical'))
          " 2>/dev/null || echo "0")

          echo "Total failed: $failed (critical: $critical_failed)"

          if [ "$critical_failed" != "0" ]; then
            echo "ERROR: $critical_failed critical quality check(s) failed — data integrity issue in production"
            exit 1
          fi

          if [ "$failed" != "0" ]; then
            echo "WARNING: $failed check(s) failed (non-critical) — review results in the dashboard"
          fi
