name: Deploy Data Platform

# Release train model:
#   - Every push to main (after tests pass): deploy to staging + smoke test
#   - Nightly at 2 AM CST (8 AM UTC): triggered by data-platform cron-runner via repository_dispatch
#   - workflow_dispatch: on-demand production deploy for hotfixes
#
# Required GitHub secrets (scoped to each environment):
#   court-vision / staging:    RAILWAY_TOKEN          (Railway env-scoped token)
#                              STAGING_PIPELINE_TOKEN (value of PIPELINE_API_TOKEN)
#                              ALERT_WEBHOOK_URL      (Discord webhook for #cv-alerts; optional)
#   court-vision / production: RAILWAY_TOKEN          (Railway env-scoped token)
#                              PRODUCTION_PIPELINE_TOKEN (value of PIPELINE_API_TOKEN)
#
# Gates: every deploy waits for GET /health (public port) to answer 200
# {"status":"ok"} — database reachable AND the private pipeline server up —
# not just /ping (static; passes with a dead database). In the staging smoke
# job only the /health gate and the pipeline-listing check can fail the job;
# the quality run is warn-only because staging data is never pristine.
#
# Required GitHub variables (scoped to each environment):
#   court-vision / staging:    DATA_PLATFORM_STAGING_URL   (public Railway URL for staging service)
#   court-vision / production: DATA_PLATFORM_PRODUCTION_URL (public Railway URL for production service)

on:
  workflow_run:
    workflows: ["Data Platform Tests"]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [nightly-deploy]  # triggered by data-platform cron at 2AM CST
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Stage 1: Deploy to staging
  # Runs only on CI push (workflow_run). Skipped on schedule/dispatch
  # since staging already has the latest code from continuous deploys.
  # ------------------------------------------------------------------
  deploy-staging:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    environment: court-vision / staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # `railway up` uploads a tarball, so RAILWAY_GIT_COMMIT_SHA is never set in the
      # container; APP_VERSION is what /health, logs, alerts and Sentry report instead.
      - name: Set APP_VERSION on data-platform-staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set "APP_VERSION=${GITHUB_SHA::7}" --service data-platform-staging --skip-deploys \
            || echo "::warning::could not set APP_VERSION"

      - name: Deploy to staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway up \
            --service data-platform-staging \
            --ci \
            -m "Deploy from ${{ github.sha }}"

      - name: Wait for staging to become healthy
        env:
          DATA_PLATFORM_STAGING_URL: ${{ vars.DATA_PLATFORM_STAGING_URL }}
        run: |
          echo "Waiting for staging to become healthy..."
          body=""
          for i in $(seq 1 30); do
            response=$(curl -s -m 15 -w "\n%{http_code}" "$DATA_PLATFORM_STAGING_URL/health" 2>/dev/null || true)
            http_status=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | sed '$d')
            health=$(echo "$body" | jq -r '.status // "unknown"' 2>/dev/null || echo "unparseable"); health=${health:-unknown}
            if [ "$http_status" = "200" ] && [ "$health" = "ok" ]; then
              echo "Staging is healthy: $body"
              exit 0
            fi
            echo "Attempt $i/30: HTTP ${http_status:-000}, status=$health — retrying in 10s..."
            sleep 10
          done
          echo "Staging failed to become healthy after 5 minutes"
          echo "Last /health body: $body"
          exit 1

  # ------------------------------------------------------------------
  # Stage 2: Smoke tests against staging
  # Runs after every staging deploy AND before every production deploy.
  # On schedule/dispatch, deploy-staging is skipped so this runs first.
  # ------------------------------------------------------------------
  smoke-test-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: >
      always() &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    environment: court-vision / staging

    steps:
      - name: Verify /health is ok
        env:
          DATA_PLATFORM_STAGING_URL: ${{ vars.DATA_PLATFORM_STAGING_URL }}
        run: |
          response=$(curl -s -m 15 -w "\n%{http_code}" "$DATA_PLATFORM_STAGING_URL/health" || true)
          http_status=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          health=$(echo "$body" | jq -r '.status // "unknown"' 2>/dev/null || echo "unparseable"); health=${health:-unknown}
          if [ "$http_status" != "200" ] || [ "$health" != "ok" ]; then
            echo "Health check failed: HTTP ${http_status:-000}, status=$health"
            echo "$body"
            exit 1
          fi
          echo "Health check: OK ($body)"

      - name: Verify pipeline API is responsive
        env:
          DATA_PLATFORM_STAGING_URL: ${{ vars.DATA_PLATFORM_STAGING_URL }}
          STAGING_TOKEN: ${{ secrets.STAGING_PIPELINE_TOKEN }}
        run: |
          status=$(curl -s -m 15 -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $STAGING_TOKEN" \
            "$DATA_PLATFORM_STAGING_URL/v1/internal/pipelines/" || echo "000")
          if [ "$status" != "200" ]; then
            echo "Pipeline listing failed: HTTP $status"
            exit 1
          fi
          echo "Pipeline API: OK"

      - name: Run data quality checks on staging (warn-only)
        env:
          DATA_PLATFORM_STAGING_URL: ${{ vars.DATA_PLATFORM_STAGING_URL }}
          STAGING_TOKEN: ${{ secrets.STAGING_PIPELINE_TOKEN }}
        run: |
          # Warn-only end to end: staging data is never pristine and the checks read
          # the shared database, so a failed/unreachable quality run is reported here
          # and must never block the release train (the /health gate above and the
          # pipeline-listing check are the only steps allowed to fail this job).
          response=$(curl -s -m 300 -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $STAGING_TOKEN" \
            "$DATA_PLATFORM_STAGING_URL/v1/internal/quality/run?triggered_by=ci" 2>/dev/null || true)
          http_status=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_status" != "200" ]; then
            echo "WARNING: quality check trigger returned HTTP ${http_status:-000} on staging — not blocking the deploy"
            echo "$body"
            exit 0
          fi

          echo "Quality checks completed:"
          echo "$body" | python3 -m json.tool || echo "$body"

          failed=$(echo "$body" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('data', {}).get('failed_checks', 0))
          " 2>/dev/null || echo "0")

          if [ "$failed" != "0" ]; then
            echo "WARNING: $failed quality check(s) failed on staging — not blocking the deploy"
          fi
          exit 0

  # ------------------------------------------------------------------
  # Stage 3: Deploy to production
  # Runs only on schedule (nightly) or workflow_dispatch (hotfix).
  # Requires staging smoke tests to have passed.
  # ------------------------------------------------------------------
  deploy-production:
    runs-on: ubuntu-latest
    needs: smoke-test-staging
    if: >
      always() &&
      needs.smoke-test-staging.result == 'success' &&
      (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
    environment: court-vision / production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # `railway up` uploads a tarball, so RAILWAY_GIT_COMMIT_SHA is never set in the
      # container; APP_VERSION is what /health, logs, alerts and Sentry report instead.
      - name: Set APP_VERSION on data-platform
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set "APP_VERSION=${GITHUB_SHA::7}" --service data-platform --skip-deploys \
            || echo "::warning::could not set APP_VERSION"

      - name: Deploy to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway up \
            --service data-platform \
            --ci \
            -m "Deploy from ${{ github.sha }}"

      - name: Wait for production to become healthy
        env:
          DATA_PLATFORM_PRODUCTION_URL: ${{ vars.DATA_PLATFORM_PRODUCTION_URL }}
        run: |
          echo "Waiting for production to become healthy..."
          body=""
          for i in $(seq 1 90); do
            response=$(curl -s -m 15 -w "\n%{http_code}" "$DATA_PLATFORM_PRODUCTION_URL/health" 2>/dev/null || true)
            http_status=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | sed '$d')
            health=$(echo "$body" | jq -r '.status // "unknown"' 2>/dev/null || echo "unparseable"); health=${health:-unknown}
            if [ "$http_status" = "200" ] && [ "$health" = "ok" ]; then
              echo "Production is healthy: $body"
              exit 0
            fi
            echo "Attempt $i/90: HTTP ${http_status:-000}, status=$health — retrying in 10s..."
            sleep 10
          done
          echo "Production failed health check — roll back via Railway dashboard"
          echo "Last /health body: $body"
          exit 1

      - name: Post-deploy verification
        env:
          DATA_PLATFORM_PRODUCTION_URL: ${{ vars.DATA_PLATFORM_PRODUCTION_URL }}
          PRODUCTION_TOKEN: ${{ secrets.PRODUCTION_PIPELINE_TOKEN }}
        run: |
          health=$(curl -s -m 15 "$DATA_PLATFORM_PRODUCTION_URL/health" | jq -r '.status // "unknown"' 2>/dev/null || echo "unparseable"); health=${health:-unknown}
          if [ "$health" != "ok" ]; then
            echo "Post-deploy verification failed: /health status=$health"
            echo "Roll back via Railway dashboard → Deployments → previous deployment → Redeploy"
            exit 1
          fi
          status=$(curl -s -m 15 -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $PRODUCTION_TOKEN" \
            "$DATA_PLATFORM_PRODUCTION_URL/v1/internal/pipelines/" || echo "000")
          if [ "$status" != "200" ]; then
            echo "Post-deploy verification failed: pipeline listing HTTP $status"
            echo "Roll back via Railway dashboard → Deployments → previous deployment → Redeploy"
            exit 1
          fi
          echo "Production deployment verified (health=ok, pipeline listing=200)"

  # ------------------------------------------------------------------
  # Failure notification: one Discord embed per failed run.
  # No-op when ALERT_WEBHOOK_URL is not configured (secrets cannot be read
  # in `if:`, so the step checks the env var and exits 0 when it is empty).
  # Runs under the staging environment only to read that environment's
  # secret; it deploys nothing.
  # ------------------------------------------------------------------
  notify-failure:
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-test-staging, deploy-production]
    if: failure()
    environment: court-vision / staging

    steps:
      - name: Post failure to Discord
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RESULT_STAGING: ${{ needs.deploy-staging.result }}
          RESULT_SMOKE: ${{ needs.smoke-test-staging.result }}
          RESULT_PRODUCTION: ${{ needs.deploy-production.result }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL not set — skipping Discord notification"
            exit 0
          fi
          jobs="deploy-staging: $RESULT_STAGING
          smoke-test-staging: $RESULT_SMOKE
          deploy-production: $RESULT_PRODUCTION"
          payload=$(jq -n \
            --arg title "$WORKFLOW failed" \
            --arg url "$RUN_URL" \
            --arg repo "$REPOSITORY" \
            --arg event "$EVENT_NAME" \
            --arg ref "$REF_NAME" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg jobs "$jobs" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
                title: $title,
                description: ("Run: " + $url),
                color: 15158332,
                fields: [
                  {name: "Repository", value: $repo, inline: true},
                  {name: "Event", value: $event, inline: true},
                  {name: "Ref", value: ($ref + " @ " + $sha), inline: true},
                  {name: "Jobs", value: $jobs}
                ],
                timestamp: $ts
             }]}')
          http_status=$(curl -s -o /dev/null -w "%{http_code}" -m 15 \
            -H "Content-Type: application/json" \
            -d "$payload" "$ALERT_WEBHOOK_URL" || true)
          echo "Discord webhook responded HTTP $http_status"
