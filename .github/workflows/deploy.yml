name: Deploy Data Platform

# Release train model:
#   - Every push to main (after tests pass): deploy to staging + smoke test
#   - Nightly at 2 AM ET (7 AM UTC): smoke test staging, then deploy to production
#   - workflow_dispatch: same as nightly (on-demand production deploy for hotfixes)
#
# Required GitHub secrets (scoped to each environment):
#   court-vision / staging:    RAILWAY_TOKEN          (Railway env-scoped token)
#                              STAGING_PIPELINE_TOKEN (value of PIPELINE_API_TOKEN)
#   court-vision / production: RAILWAY_TOKEN          (Railway env-scoped token)
#                              PRODUCTION_PIPELINE_TOKEN (value of PIPELINE_API_TOKEN)
#
# Required GitHub variables (scoped to each environment):
#   court-vision / staging:    DATA_PLATFORM_STAGING_URL   (public Railway URL for staging service)
#   court-vision / production: DATA_PLATFORM_PRODUCTION_URL (public Railway URL for production service)

on:
  workflow_run:
    workflows: ["Data Platform Tests"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 7 * * *'  # 2 AM ET daily — deploy previous day's changes to production
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Stage 1: Deploy to staging
  # Runs only on CI push (workflow_run). Skipped on schedule/dispatch
  # since staging already has the latest code from continuous deploys.
  # ------------------------------------------------------------------
  deploy-staging:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    environment: court-vision / staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway up \
            --service data-platform-staging \
            --ci \
            -m "Deploy from ${{ github.sha }}"

      - name: Wait for staging to become healthy
        env:
          DATA_PLATFORM_STAGING_URL: ${{ vars.DATA_PLATFORM_STAGING_URL }}
        run: |
          echo "Waiting for staging to become healthy..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$DATA_PLATFORM_STAGING_URL/ping" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Staging is healthy!"
              exit 0
            fi
            echo "Attempt $i/30: HTTP $status — retrying in 10s..."
            sleep 10
          done
          echo "Staging failed to become healthy after 5 minutes"
          exit 1

  # ------------------------------------------------------------------
  # Stage 2: Smoke tests against staging
  # Runs after every staging deploy AND before every production deploy.
  # On schedule/dispatch, deploy-staging is skipped so this runs first.
  # ------------------------------------------------------------------
  smoke-test-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: >
      always() &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    environment: court-vision / staging

    steps:
      - name: Verify pipeline API is responsive
        env:
          DATA_PLATFORM_STAGING_URL: ${{ vars.DATA_PLATFORM_STAGING_URL }}
          STAGING_TOKEN: ${{ secrets.STAGING_PIPELINE_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $STAGING_TOKEN" \
            "$DATA_PLATFORM_STAGING_URL/v1/internal/pipelines/")
          if [ "$status" != "200" ]; then
            echo "Pipeline listing failed: HTTP $status"
            exit 1
          fi
          echo "Pipeline API: OK"

      - name: Run data quality checks on staging
        env:
          DATA_PLATFORM_STAGING_URL: ${{ vars.DATA_PLATFORM_STAGING_URL }}
          STAGING_TOKEN: ${{ secrets.STAGING_PIPELINE_TOKEN }}
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $STAGING_TOKEN" \
            "$DATA_PLATFORM_STAGING_URL/v1/internal/quality/run?triggered_by=ci")
          body=$(echo "$response" | head -n -1)
          http_status=$(echo "$response" | tail -n 1)

          if [ "$http_status" != "200" ]; then
            echo "Quality check trigger failed: HTTP $http_status"
            echo "$body"
            exit 1
          fi

          echo "Quality checks completed:"
          echo "$body" | python3 -m json.tool || echo "$body"

          # Log failures but don't block — staging data may not be pristine.
          failed=$(echo "$body" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('data', {}).get('failed_checks', 0))
          " 2>/dev/null || echo "0")

          if [ "$failed" != "0" ]; then
            echo "WARNING: $failed quality check(s) failed on staging"
          fi

  # ------------------------------------------------------------------
  # Stage 3: Deploy to production
  # Runs only on schedule (nightly) or workflow_dispatch (hotfix).
  # Requires staging smoke tests to have passed.
  # ------------------------------------------------------------------
  deploy-production:
    runs-on: ubuntu-latest
    needs: smoke-test-staging
    if: >
      always() &&
      needs.smoke-test-staging.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    environment: court-vision / production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway up \
            --service data-platform \
            --ci \
            -m "Deploy from ${{ github.sha }}"

      - name: Wait for production to become healthy
        env:
          DATA_PLATFORM_PRODUCTION_URL: ${{ vars.DATA_PLATFORM_PRODUCTION_URL }}
        run: |
          echo "Waiting for production to become healthy..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$DATA_PLATFORM_PRODUCTION_URL/ping" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Production is healthy!"
              exit 0
            fi
            echo "Attempt $i/30: HTTP $status — retrying in 10s..."
            sleep 10
          done
          echo "Production failed health check — roll back via Railway dashboard"
          exit 1

      - name: Post-deploy verification
        env:
          DATA_PLATFORM_PRODUCTION_URL: ${{ vars.DATA_PLATFORM_PRODUCTION_URL }}
          PRODUCTION_TOKEN: ${{ secrets.PRODUCTION_PIPELINE_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $PRODUCTION_TOKEN" \
            "$DATA_PLATFORM_PRODUCTION_URL/v1/internal/pipelines/")
          if [ "$status" != "200" ]; then
            echo "Post-deploy verification failed: HTTP $status"
            echo "Roll back via Railway dashboard → Deployments → previous deployment → Redeploy"
            exit 1
          fi
          echo "Production deployment verified"
