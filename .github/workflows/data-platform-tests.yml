name: Data Platform Tests

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/data-platform-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "**"
      - ".github/workflows/data-platform-tests.yml"
  schedule:
    # 07:00 UTC daily (02:00 America/Chicago during standard time)
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cv_test
          POSTGRES_USER: cv
          POSTGRES_PASSWORD: cv
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cv -d cv_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://cv:cv@127.0.0.1:5432/cv_test
      PIPELINE_API_TOKEN: ci-test-token
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit and API tests
        run: |
          python -m pytest -m "unit or api" --cov=. --cov-report=term-missing --cov-report=xml

      - name: Run integration tests (main/nightly/manual)
        if: github.event_name != 'pull_request'
        run: |
          set +e
          python -m pytest -m "integration"
          status=$?
          if [ $status -eq 5 ]; then
            echo "No integration tests collected yet."
            exit 0
          fi
          exit $status

      - name: Run quality tests (nightly/manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set +e
          python -m pytest -m "quality"
          status=$?
          if [ $status -eq 5 ]; then
            echo "No quality tests collected yet."
            exit 0
          fi
          exit $status

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-platform-coverage
          path: coverage.xml

  # The React dashboard (dashboard/). The API and its only consumer share this
  # repo, so the schema snapshot is re-exported and compared here, in the same
  # run as the code that changed it: there is no deployed copy to lag behind.
  dashboard:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://cv:cv@127.0.0.1:5432/cv_test # never connected to
      PIPELINE_API_TOKEN: ci-test-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: OpenAPI snapshot is fresh
        run: |
          python scripts/export_openapi.py > /tmp/openapi.json
          if ! diff -q /tmp/openapi.json dashboard/openapi/openapi.json; then
            echo "::error::dashboard/openapi/openapi.json is behind the API. Run: python scripts/export_openapi.py > dashboard/openapi/openapi.json && (cd dashboard && bun run generate:api)"
            diff /tmp/openapi.json dashboard/openapi/openapi.json | head -40
            exit 1
          fi

      - name: Generated API types are fresh
        working-directory: dashboard
        run: |
          bun run generate:api
          git diff --exit-code -- src/types/generated

      - name: Unit tests
        working-directory: dashboard
        run: bun test src

      # tsc, vite build, then scripts/check-build.ts
      - name: Typecheck and build
        working-directory: dashboard
        run: bun run build
